<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6fd6">
<title>Penalty Star · Fugio</title>
<meta name="description" content="Penalty Star: Foxino takes the penalties. Read the sentence and tap the bubble with the right word to score; a wrong word and Rob the goalkeeper saves it. Ten penalties per game.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="penalty.css?v=1">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="labels"></div>

<div id="hud" class="hidden">
  <div id="card">
    <div id="cardTop"><span id="cardKick">PENALTY 1 / 10</span><span id="shoot" aria-label="Penalties"></span></div>
    <div id="sentence"></div>
    <div id="noteRow"><span id="note"></span><button id="nextBtn" type="button" class="hidden">NEXT <span aria-hidden="true">&#9654;</span></button></div>
  </div>
</div>

<div id="banner" aria-live="polite"></div>
<div id="flash"></div>

<button id="leaveBtn" class="topbtn" type="button" aria-label="Leave the game">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>LEAVE</span>
</button>
<button id="muteBtn" class="topbtn" type="button" aria-label="Sound on or off">
  <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>

<section id="start" class="screen hidden" aria-label="Start">
  <div class="title-wrap">
    <h1 class="title"><span class="t1">PENALTY</span><span class="t2">STAR</span></h1>
    <p class="subtitle">Tap the bubble with the right word. Score the goal!</p>
  </div>
  <div class="start-panel">
    <div id="bestLine" class="best-line hidden"></div>
    <button id="packBtn" class="packcard" type="button"></button>
    <button id="playBtn" class="bigbtn" type="button">PLAY</button>
  </div>
</section>

<section id="end" class="screen hidden" aria-label="Results">
  <div class="panel end-panel">
    <h2 id="endTitle">Great shooting!</h2>
    <div class="stars" id="stars"><i></i><i></i><i></i></div>
    <div class="endscore"><b id="endGoals">0</b><span>/ 10 goals</span></div>
    <div id="endShoot" class="shoot-row"></div>
    <div id="endBest" class="best-line"></div>
    <div id="missed" class="missed hidden"><small>Learn these sentences</small><ol id="missedList"></ol></div>
    <button id="packBtn2" class="packcard" type="button"></button>
    <button id="againBtn" class="bigbtn" type="button">PLAY AGAIN</button>
  </div>
</section>

<div id="loading"><div class="load-box"><div class="load-title">PENALTY STAR</div><div class="load-bar"><i id="loadFill"></i></div><div class="load-text" id="loadText">Getting the stadium ready…</div></div></div>
<noscript>Penalty Star needs JavaScript.</noscript>
<script src="packages.js?v=1"></script>
<script src="/shared/pack-picker.js?v=8"></script>
<script type="module" src="game.js?v=1"></script>
</body>
</html>
